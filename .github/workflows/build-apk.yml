name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - mail.html
      - assets/icon.svg
      - native/**
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Signatur-Schluessel (wird beim ersten Mal angelegt)
        run: |
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MailMultiversum,O=MailMultiversum,C=DE"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "Signatur-Schluessel angelegt"
            git pull --rebase origin main
            git push
          fi

      - name: Projekt vorbereiten
        run: |
          mkdir -p build/www/fonts
          cd build
          npm init -y > /dev/null
          npm i --no-audit --no-fund @capacitor/core@7 @capacitor/android@7 @capacitor/browser@7 @capacitor/app@7 @capacitor/local-notifications@7 @fontsource/space-grotesk@5
          npm i --no-audit --no-fund -D @capacitor/cli@7
          cp ../mail.html www/index.html
          sed -i 's/const APP_BUILD = 0;/const APP_BUILD = ${{ github.run_number }};/' www/index.html
          grep -q 'const APP_BUILD = ${{ github.run_number }};' www/index.html
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          cp ../assets/icon.svg www/icon.svg
          for w in 400 500 700; do cp node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-$w-normal.woff2 www/fonts/sg-$w.woff2; done
          echo '{"appId":"de.mrdocmoris.mail","appName":"Mail-Multiversum","webDir":"www","android":{"allowMixedContent":false,"webContentsDebuggingEnabled":false}}' > capacitor.config.json
          npx cap add android

          # Eigener Java-Teil: IMAP/SMTP zu Posteo, Keystore, Hintergrund-Abruf
          J=android/app/src/main/java/de/mrdocmoris/mail
          mkdir -p $J
          cp ../native/*.java $J/
          ls $J

          # Manifest: Benachrichtigungen erlauben, keine Cloud-Sicherung der App-Daten
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application#' $M
          sed -i 's#android:allowBackup="true"#android:allowBackup="false"#' $M
          grep -q POST_NOTIFICATIONS $M && grep -q 'allowBackup="false"' $M

          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          cat >> android/app/build.gradle << 'GRADLE'

          dependencies {
              implementation 'com.sun.mail:android-mail:1.6.7'
              implementation 'com.sun.mail:android-activation:1.6.7'
              implementation 'androidx.work:work-runtime:2.9.1'
          }

          android {
              packaging {
                  resources {
                      excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/DEPENDENCIES', 'META-INF/mailcap.default', 'META-INF/mimetypes.default']
                  }
              }
              signingConfigs {
                  mail {
                      storeFile file(System.getenv("MAIL_KEYSTORE"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.mail }
              }
          }
          GRADLE

      - name: App-Icon erzeugen
        continue-on-error: true
        run: |
          cd build
          mkdir -p assets
          cp ../assets/icon.svg assets/icon.svg
          npm i --no-audit --no-fund sharp @capacitor/assets
          node -e "const s=require('sharp');(async()=>{await s('assets/icon.svg').resize(1024,1024).png().toFile('assets/icon-only.png');await s('assets/icon.svg').resize(1024,1024).png().toFile('assets/icon-foreground.png');await s({create:{width:1024,height:1024,channels:3,background:'#07061a'}}).png().toFile('assets/icon-background.png');})()"
          npx @capacitor/assets generate --android --iconBackgroundColor '#07061a' --iconBackgroundColorDark '#07061a' --splashBackgroundColor '#0b0a1a' --splashBackgroundColorDark '#0b0a1a'

      - name: APK bauen
        run: |
          cd build
          npx cap sync android
          cd android
          chmod +x gradlew
          MAIL_KEYSTORE="$GITHUB_WORKSPACE/signing/debug.keystore" ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Mail-Multiversum.apk"
          # Prüfen: APK muss mit dem Schlüssel aus dem Repo signiert sein
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          A=$("$AS" verify --print-certs "$GITHUB_WORKSPACE/Mail-Multiversum.apk" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          K=$(keytool -list -v -keystore "$GITHUB_WORKSPACE/signing/debug.keystore" -storepass android -alias androiddebugkey | grep -i "SHA256:" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          echo "APK: $A"; echo "Key: $K"
          [ -n "$A" ] && [ "$A" = "$K" ] || { echo "FEHLER: falsche Signatur"; exit 1; }

      - name: APK veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Mail-Multiversum 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Mail-Multiversum.apk

      - name: Update-Info fuer die App (app/version.json)
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p app
          N=${{ github.run_number }}
          SIZE=$(stat -c %s Mail-Multiversum.apk)
          URL="https://github.com/${{ github.repository }}/releases/download/v1.$N/Mail-Multiversum.apk"
          FIRST=$(printf '%s' "$NOTES" | head -1)
          jq -n --argjson b "$N" --arg v "1.$N" --argjson s "$SIZE" --arg a "$URL" --arg n "$FIRST" \
            '{build:$b, version:$v, size:$s, apk:$a, notes:$n}' > app/version.json
          cat app/version.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/version.json
          git commit -m "Version 1.$N veroeffentlicht"
          git pull --rebase origin main
          git push
